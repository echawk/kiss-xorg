name: KISS Auto Package Updater

on:
  schedule:
    # Runs every Sunday at midnight (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git Configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up KISS Linux Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum
          curl -sL https://codeberg.org/kiss-community/kiss/raw/branch/master/contrib/kiss-outdated > /usr/local/bin/kiss-outdated
          curl -sL https://codeberg.org/kiss-community/kiss/raw/branch/master/kiss > /usr/local/bin/kiss
          curl -sL https://raw.githubusercontent.com/echawk/kiss-personal/refs/heads/master/bin/kiss-echecksum > /usr/local/bin/kiss-echecksum
          curl -sL https://raw.githubusercontent.com/echawk/kiss-personal/refs/heads/master/bin/kiss-edownload > /usr/local/bin/kiss-edownload
          chmod +x /usr/local/bin/kiss-outdated /usr/local/bin/kiss-echecksum /usr/local/bin/kiss-edownload /usr/local/bin/kiss
          echo "Setting up KISS environment..."

      - name: Run KISS Auto Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KISS_PATH: ${{ github.workspace }}
        run: |
          [ -e ".kiss_auto" ] || { echo "No .kiss_auto found. Exiting."; exit 1; }

          # Dynamic date identifier (e.g., 8-16)
          WEEK_DATE=$(date +"%-m-%-d-%y")
          BRANCH_NAME="update/week-of-${WEEK_DATE}"

          git checkout -B "$BRANCH_NAME" origin/master

          UPDATES_COUNT=0
          PR_BODY="Automated package updates for week of ${WEEK_DATE}:%0A"

          while read -r LINE; do
            repodir="${LINE%%,*}"
            pkgs="${LINE##*,}"
            pkg_regex=$(echo "$pkgs" | sed 's/ /|/g')

            outdated_list=$(kiss-outdated "$repodir" | grep -E "($pkg_regex)" || true)
            [ -z "$outdated_list" ] && continue

            while read -r PKG_LINE; do
              [ -z "$PKG_LINE" ] && continue
              pkg="${PKG_LINE%% *}"
              newver="${PKG_LINE##* }"

              echo "==> Processing update for $pkg to version $newver"

              cd "${GITHUB_WORKSPACE}/${repodir}/${pkg}"
              read -r oldver oldrel < version

              echo "$newver 1" > version

              if kiss edownload && kiss echecksum; then
                git add .
                git commit -m "$pkg: bump to $newver"
                UPDATES_COUNT=$((UPDATES_COUNT + 1))
                PR_BODY="${PR_BODY}%0A- **${pkg}**: ${oldver} ➔ ${newver}"
              else
                echo "==> Failed to download/checksum $pkg $newver. Reverting."
                git checkout -- .
              fi
              cd "${GITHUB_WORKSPACE}"
            done <<< "$outdated_list"
          done < <(sort -u ".kiss_auto")

          if [ "$UPDATES_COUNT" -gt 0 ]; then
            echo "==> Pushing $UPDATES_COUNT update(s) to $BRANCH_NAME..."
            git push origin "$BRANCH_NAME" --force

            if ! gh pr list --state open --head "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
              gh pr create \
                --title "chore(deps): updates for week of ${WEEK_DATE}" \
                --body "$(echo -e "$PR_BODY")" \
                --base master \
                --head "$BRANCH_NAME"
            fi
          else
            echo "No package updates processed."
          fi
